    const STORAGE_KEY = "payback_tracker_data_v2";
    const SETTINGS_KEY = "payback_settings_v2";

    function loadSettings() {
      const saved = localStorage.getItem(SETTINGS_KEY);
      if (saved) {
        try { return JSON.parse(saved); } catch(e){}
      }
      return { theme: 'LIGHT', language: 'ru' };
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { return JSON.parse(saved); } catch(e){}
      }
      return [
        {
          id: 1,
          name: "Кофейня ToGo",
          transactions: [
            { id: 1, amount: 250000, type: "EXPENSE" },
            { id: 2, amount: 60000, type: "EXPENSE" },
            { id: 3, amount: 180000, type: "INCOME" },
            { id: 4, amount: 210000, type: "INCOME" }
          ]
        },
        {
          id: 2,
          name: "Телеграм-канал",
          transactions: [
            { id: 5, amount: 45000, type: "EXPENSE" },
            { id: 6, amount: 15000, type: "INCOME" }
          ]
        }
      ];
    }

    let settings = loadSettings();
    let projects = loadData();
    let currentScreen = "list";
    let currentProjectId = null;
    let modalState = null;

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      applyTheme();
      render();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
      render();
    }

    function t() {
      return STRINGS[settings.language] || STRINGS.ru;
    }

    function isDark() {
      return settings.theme === 'DARK';
    }

    function applyTheme() {
      const shell = document.getElementById("deviceShell");
      const statusBar = document.getElementById("statusBar");
      const homeBar = document.getElementById("homeBar");
      const dark = isDark();

      if (dark) {
        shell.className = "w-full max-w-md bg-slate-900 text-slate-100 rounded-[36px] shadow-2xl border-[6px] border-slate-700 overflow-hidden flex flex-col h-[780px] relative transition-colors duration-200";
        statusBar.className = "bg-slate-900 px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold text-slate-400 select-none border-b border-slate-800 transition-colors";
        homeBar.className = "bg-slate-900 py-2 flex justify-center border-t border-slate-800 transition-colors";
      } else {
        shell.className = "w-full max-w-md bg-slate-50 text-slate-900 rounded-[36px] shadow-2xl border-[6px] border-slate-800 overflow-hidden flex flex-col h-[780px] relative transition-colors duration-200";
        statusBar.className = "bg-slate-50 px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold text-slate-600 select-none border-b border-slate-200/50 transition-colors";
        homeBar.className = "bg-slate-50 py-2 flex justify-center border-t border-slate-200/50 transition-colors";
      }
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('ru-RU').format(num) + ' ₽';
    }

    function formatBalance(bal) {
      const sign = bal > 0 ? '+' : (bal < 0 ? '−' : '');
      const absVal = Math.abs(bal);
      return sign + ' ' + new Intl.NumberFormat('ru-RU').format(absVal) + ' ₽';
    }

    function getStats(project) {
      let expense = 0;
      let income = 0;
      project.transactions.forEach(t => {
        if (t.type === 'EXPENSE') expense += t.amount;
        if (t.type === 'INCOME') income += t.amount;
      });
      return { expense, income, balance: income - expense };
    }

    function render() {
      const app = document.getElementById("app");
      if (currentScreen === "settings") {
        renderSettings(app);
      } else if (currentScreen === "detail" && currentProjectId !== null) {
        renderProjectDetail(app);
      } else {
        renderProjectList(app);
      }
      renderModal();
    }

      const balanceColor = isProfitable ? 'text-emerald-500' : 'text-rose-500';
      const badgeClass = isProfitable ? (dark ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-800' : 'bg-emerald-100 text-emerald-800') : (dark ? 'bg-rose-950/80 text-rose-400 border border-rose-800' : 'bg-rose-100 text-rose-800');

              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>

              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"/></svg>
            </button>
            <button onclick="openDeleteModal(${project.id})" class="p-1.5 text-slate-400 hover:text-rose-500 rounded-lg hover:bg-rose-500/10">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>

        <div class="p-4 space-y-4 flex-1">

            <div class="text-4xl font-black ${balanceColor} tracking-tight mt-1 mb-2">${formatBalance(stats.balance)}</div>
            <span class="inline-block text-xs font-bold px-3 py-1 rounded-full ${badgeClass}">${badgeText}</span>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="${cardBg} rounded-2xl p-4 border shadow-sm">
              <span class="text-xs ${dark ? 'text-slate-400' : 'text-slate-500'} font-medium">${str.spent}</span>
              <div class="text-xl font-bold text-rose-500 mt-1">${formatNumber(stats.expense)}</div>
            </div>
            <div class="${cardBg} rounded-2xl p-4 border shadow-sm">
              <span class="text-xs ${dark ? 'text-slate-400' : 'text-slate-500'} font-medium">${str.received}</span>
              <div class="text-xl font-bold text-emerald-500 mt-1">${formatNumber(stats.income)}</div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-1">
            <button onclick="openAddTransactionModal('EXPENSE')" class="h-14 rounded-2xl ${dark ? 'bg-rose-950/80 hover:bg-rose-900/90 text-rose-400 border border-rose-800' : 'bg-rose-100 hover:bg-rose-200 text-rose-700'} font-bold flex items-center justify-center gap-2 transition active:scale-95 shadow-sm">
              <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14"/></svg>
              <span>${str.actionSpent}</span>
            </button>

            <button onclick="openAddTransactionModal('INCOME')" class="h-14 rounded-2xl ${dark ? 'bg-emerald-950/80 hover:bg-emerald-900/90 text-emerald-400 border border-emerald-800' : 'bg-emerald-100 hover:bg-emerald-200 text-emerald-800'} font-bold flex items-center justify-center gap-2 transition active:scale-95 shadow-sm">
              <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
              <span>${str.actionReceived}</span>
            </button>
          </div>

          <div class="pt-2">
            <h3 class="text-xs font-bold uppercase tracking-wider ${dark ? 'text-slate-400' : 'text-slate-500'} mb-2">${str.operationsHistory}</h3>
      `;

      if (project.transactions.length === 0) {
        html += `
          <div class="${cardBg} rounded-2xl p-6 border text-center text-xs text-slate-400">
            ${str.emptyOperationsDesc}
          </div>
        `;
      } else {
        html += `<div class="space-y-2">`;

        reversed.forEach(t => {

          const sign = isExpense ? '-' : '+';
          const iconBg = isExpense ? (dark ? 'bg-rose-900/60 text-rose-400' : 'bg-rose-100 text-rose-600') : (dark ? 'bg-emerald-900/60 text-emerald-400' : 'bg-emerald-100 text-emerald-700');
          const amountColor = isExpense ? 'text-rose-500' : 'text-emerald-500';
          const title = isExpense ? str.actionSpent : str.actionReceived;

          html += `
            <div class="${cardBg} rounded-xl px-4 py-3 border flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full ${iconBg} flex items-center justify-center font-bold text-sm">
                  ${sign}
                </div>
                <div class="text-sm font-semibold">${title}</div>
              </div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-base ${amountColor}">${sign}${formatNumber(t.amount)}</span>
                <button onclick="deleteTransaction(${t.id})" class="p-1 text-slate-400 hover:text-slate-200 rounded">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `
          </div>
        </div>
      `;
      container.innerHTML = html;
    }

    // SCREEN 3: Settings Screen
    function renderSettings(container) {
      const str = t();
      const dark = isDark();
      const topBarBg = dark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200';
      const cardBg = dark ? 'bg-slate-800/90 border-slate-700/80 text-white' : 'bg-white border-slate-200/90 text-slate-900';

      const languages = [
        { code: 'ru', title: 'Русский', short: 'RU' },
        { code: 'en', title: 'English', short: 'EN' },
        { code: 'uk', title: 'Українська', short: 'UK' },
        { code: 'be', title: 'Беларуская', short: 'BE' },
        { code: 'kk', title: 'Қазақша', short: 'KK' }
      ];

      let html = `
        <div class="px-4 py-3 flex items-center gap-2 border-b ${topBarBg} sticky top-0 z-10">
          <button onclick="currentScreen='list'; render();" class="p-1.5 -ml-1 ${dark ? 'text-slate-200 hover:bg-slate-800' : 'text-slate-700 hover:bg-slate-100'} rounded-full active:scale-95">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
          </button>
          <h1 class="text-lg font-bold">${str.settings}</h1>
        </div>

        <div class="p-4 space-y-5 flex-1">
          <div>
            <h2 class="text-xs font-bold uppercase tracking-wider ${dark ? 'text-slate-400' : 'text-slate-500'} mb-2">${str.themeSection}</h2>
            <div class="${cardBg} rounded-2xl border divide-y ${dark ? 'divide-slate-700' : 'divide-slate-100'} overflow-hidden shadow-sm">
              <div onclick="setTheme('LIGHT')" class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-500/10 transition">
                <div class="flex items-center gap-3">
                  <span class="text-lg">☀️</span>
                  <span class="text-sm font-medium ${settings.theme === 'LIGHT' ? 'font-bold text-emerald-500' : ''}">${str.themeLight}</span>
                </div>
                ${settings.theme === 'LIGHT' ? '<span class="text-emerald-500 font-bold">✓</span>' : ''}
              </div>
              <div onclick="setTheme('DARK')" class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-500/10 transition">
                <div class="flex items-center gap-3">
                  <span class="text-lg">🌙</span>
                  <span class="text-sm font-medium ${settings.theme === 'DARK' ? 'font-bold text-emerald-500' : ''}">${str.themeDark}</span>
                </div>
                ${settings.theme === 'DARK' ? '<span class="text-emerald-500 font-bold">✓</span>' : ''}
              </div>
            </div>
          </div>

          <div>
            <h2 class="text-xs font-bold uppercase tracking-wider ${dark ? 'text-slate-400' : 'text-slate-500'} mb-2">${str.languageSection}</h2>
            <div class="${cardBg} rounded-2xl border divide-y ${dark ? 'divide-slate-700' : 'divide-slate-100'} overflow-hidden shadow-sm">
      `;

      languages.forEach(l => {
        const isSel = settings.language === l.code;
        html += `
          <div onclick="setLanguage('${l.code}')" class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-500/10 transition">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-full ${isSel ? (dark ? 'bg-emerald-900 text-emerald-300' : 'bg-emerald-100 text-emerald-800') : (dark ? 'bg-slate-700 text-slate-300' : 'bg-slate-100 text-slate-600')} text-[11px] font-bold flex items-center justify-center">${l.short}</span>
              <span class="text-sm ${isSel ? 'font-bold text-emerald-500' : 'font-medium'}">${l.title}</span>
            </div>
            ${isSel ? '<span class="text-emerald-500 font-bold">✓</span>' : ''}
          </div>
        `;
      });

      html += `
            </div>
          </div>

          <div>
            <h2 class="text-xs font-bold uppercase tracking-wider ${dark ? 'text-slate-400' : 'text-slate-500'} mb-2">${str.aboutSection}</h2>
            <div class="${cardBg} rounded-2xl p-4 border shadow-sm">
              <h3 class="font-bold text-base">${str.appName}</h3>
              <p class="text-xs text-slate-400 mt-0.5">${str.appVersion}</p>
              <p class="text-xs ${dark ? 'text-slate-300' : 'text-slate-600'} mt-2">${str.offlineGuarantee}</p>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function setTheme(th) {
      settings.theme = th;
      saveSettings();
    }

    function setLanguage(lang) {
      settings.language = lang;
      saveSettings();
    }

    // MODAL DIALOGS
    function openAddProjectModal() {
      modalState = { type: 'add_project' };
      renderModal();
    }

    function openRenameModal(projectId) {
      const p = projects.find(item => item.id === projectId);
      if (!p) return;
      modalState = { type: 'rename_project', projectId, currentName: p.name };
      renderModal();
    }

    function openDeleteModal(projectId) {
      const p = projects.find(item => item.id === projectId);
      if (!p) return;
      modalState = { type: 'delete_project', projectId, name: p.name };
      renderModal();
    }

    function openAddTransactionModal(initialType) {
      modalState = { type: 'add_transaction', txType: initialType };
      renderModal();
    }

    function closeModal() {
      modalState = null;
      renderModal();
    }

    function renderModal() {
      let modalContainer = document.getElementById("modal-root");
      if (!modalContainer) {
        modalContainer = document.createElement("div");
        modalContainer.id = "modal-root";
        document.body.appendChild(modalContainer);
      }

      if (!modalState) {
        modalContainer.innerHTML = "";
        return;
      }

      const str = t();
      const dark = isDark();
      const modalBg = dark ? 'bg-slate-800 text-white border-slate-700' : 'bg-white text-slate-900 border-slate-100';
      const inputBg = dark ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900';

      let content = "";

      if (modalState.type === 'add_project') {
        content = `
          <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeModal()">
            <div class="${modalBg} rounded-3xl p-6 w-full max-w-sm shadow-2xl border" onclick="event.stopPropagation()">
              <h3 class="text-xl font-bold mb-1">${str.newProject}</h3>
              <p class="text-xs text-slate-400 mb-4">${str.projectNameLabel}</p>
              <input id="projNameInput" type="text" placeholder="${str.projectNamePlaceholder}" class="w-full px-4 py-3 rounded-xl border ${inputBg} focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-medium mb-5" autofocus />
              <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-slate-400 font-medium text-sm hover:bg-slate-700/30">${str.cancel}</button>
                <button onclick="submitAddProject()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow">${str.create}</button>
              </div>
            </div>
          </div>
        `;
      } else if (modalState.type === 'rename_project') {
        content = `
          <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeModal()">
            <div class="${modalBg} rounded-3xl p-6 w-full max-w-sm shadow-2xl border" onclick="event.stopPropagation()">
              <h3 class="text-xl font-bold mb-1">${str.renameProject}</h3>
              <p class="text-xs text-slate-400 mb-4">${str.projectNameLabel}</p>
              <input id="projRenameInput" type="text" value="${escapeHtml(modalState.currentName)}" class="w-full px-4 py-3 rounded-xl border ${inputBg} focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm font-medium mb-5" autofocus />
              <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-slate-400 font-medium text-sm hover:bg-slate-700/30">${str.cancel}</button>
                <button onclick="submitRenameProject(${modalState.projectId})" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow">${str.save}</button>
              </div>
            </div>
          </div>
        `;
      } else if (modalState.type === 'delete_project') {
        content = `
          <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeModal()">
            <div class="${modalBg} rounded-3xl p-6 w-full max-w-sm shadow-2xl border" onclick="event.stopPropagation()">
              <h3 class="text-xl font-bold mb-2">${str.deleteConfirmTitle(escapeHtml(modalState.name))}</h3>
              <p class="text-xs text-slate-400 mb-5 leading-relaxed">${str.deleteConfirmMessage}</p>
              <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-slate-400 font-medium text-sm hover:bg-slate-700/30">${str.cancel}</button>
                <button onclick="submitDeleteProject(${modalState.projectId})" class="px-5 py-2.5 rounded-xl bg-rose-600 text-white font-semibold text-sm hover:bg-rose-700 shadow">${str.delete}</button>
              </div>
            </div>
          </div>
        `;
      } else if (modalState.type === 'add_transaction') {
        const isExp = modalState.txType === 'EXPENSE';
        content = `
          <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeModal()">
            <div class="${modalBg} rounded-3xl p-6 w-full max-w-sm shadow-2xl border" onclick="event.stopPropagation()">
              <h3 class="text-xl font-bold mb-3">${isExp ? str.actionSpent : str.actionReceived}</h3>

              <div class="${dark ? 'bg-slate-900' : 'bg-slate-100'} p-1 rounded-xl flex gap-1 mb-4">
                <button onclick="setModalTxType('EXPENSE')" class="flex-1 py-2 text-xs font-bold rounded-lg transition ${isExp ? (dark ? 'bg-rose-900/80 text-rose-300' : 'bg-rose-100 text-rose-700') : 'text-slate-400'}">${str.actionSpent}</button>
                <button onclick="setModalTxType('INCOME')" class="flex-1 py-2 text-xs font-bold rounded-lg transition ${!isExp ? (dark ? 'bg-emerald-900/80 text-emerald-300' : 'bg-emerald-100 text-emerald-800') : 'text-slate-400'}">${str.actionReceived}</button>
              </div>

              <div class="relative mb-5">
                <input id="txAmountInput" type="number" step="any" min="0" placeholder="0" class="w-full px-4 py-3 rounded-xl border ${inputBg} focus:outline-none focus:ring-2 ${isExp ? 'focus:ring-rose-500' : 'focus:ring-emerald-500'} text-lg font-bold pr-10" autofocus />
                <span class="absolute right-4 top-3.5 text-slate-400 font-bold">₽</span>
              </div>

              <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-slate-400 font-medium text-sm hover:bg-slate-700/30">${str.cancel}</button>
                <button onclick="submitAddTransaction()" class="px-5 py-2.5 rounded-xl ${isExp ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-600 hover:bg-emerald-700'} text-white font-semibold text-sm shadow">
                  ${isExp ? '+ ' + str.actionSpent : '+ ' + str.actionReceived}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      modalContainer.innerHTML = content;
      setTimeout(() => {
        const inp = document.getElementById("projNameInput") || document.getElementById("projRenameInput") || document.getElementById("txAmountInput");
        if (inp) inp.focus();
      }, 50);
    }

    function setModalTxType(type) {
      if (modalState && modalState.type === 'add_transaction') {
        modalState.txType = type;
        renderModal();
      }
    }

    function submitAddProject() {
      const input = document.getElementById("projNameInput");
      const name = input ? input.value.trim() : "";
      if (!name) return;
      projects.unshift({ id: Date.now(), name, transactions: [] });
      closeModal();
      saveData();
    }

    function submitRenameProject(id) {
      const input = document.getElementById("projRenameInput");
      const name = input ? input.value.trim() : "";
      if (!name) return;
      const p = projects.find(item => item.id === id);
      if (p) {
        p.name = name;
        closeModal();
        saveData();
      }
    }

    function submitDeleteProject(id) {
      projects = projects.filter(item => item.id !== id);
      if (currentProjectId === id) {
        currentProjectId = null;
        currentScreen = "list";
      }
      closeModal();
      saveData();
    }

    function submitAddTransaction() {
      const input = document.getElementById("txAmountInput");
      const val = parseFloat(input ? input.value : 0);
      if (!val || val <= 0) return;
      const p = projects.find(item => item.id === currentProjectId);
      if (p) {
        p.transactions.push({ id: Date.now(), amount: val, type: modalState.txType });
        closeModal();
        saveData();
      }
    }

    function deleteTransaction(txId) {
      const p = projects.find(item => item.id === currentProjectId);
      if (p) {
        p.transactions = p.transactions.filter(t => t.id !== txId);
        saveData();
      }
    }

    function openProject(id) {
      currentProjectId = id;
      currentScreen = "detail";
      render();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    applyTheme();
    render();
  </script>
</body>
